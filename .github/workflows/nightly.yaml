name: nightly
'on':
  schedule:
  - cron: 37 5 * * *
  workflow_dispatch: null
  push:
    branches:
    - main
    paths:
    - '**/Cargo.toml'
    - Cargo.lock
    - rust-toolchain.toml
    - .github/workflows/nightly.yaml
  pull_request:
    branches:
    - main
    types:
    - opened
    - synchronize
    - reopened
    - labeled
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref
    }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -C debuginfo=0
jobs:
  gate:
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: read
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
    - uses: dorny/paths-filter@v3
      if: github.event_name == 'pull_request'
      id: changes
      with:
        filters: "nightly:\n  - '**/Cargo.toml'\n  - 'Cargo.lock'\n  - 'rust-toolchain.toml'\n\
          \  - '.github/workflows/nightly.yaml'\n"
    - id: decide
      run: "echo \"run=${{ github.event_name != 'pull_request' ||\n  contains(github.event.pull_request.labels.*.name,\
        \ 'nightly') ||\n  steps.changes.outputs.nightly == 'true' }}\" >> \"$GITHUB_OUTPUT\"\
        \n"
  feature-powerset:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-24.04
    steps:
    - name: "\U0001F4C2 Checkout code"
      uses: actions/checkout@v6
    - name: "\U0001F4B0 Cache"
      uses: Swatinem/rust-cache@v2
    - name: Install cargo-hack
      uses: taiki-e/install-action@v2.77.1
      with:
        tool: cargo-hack
    - name: cargo hack check --feature-powerset --no-dev-deps
      run: cargo hack check --feature-powerset --no-dev-deps
  release-target:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
        - target: x86_64-unknown-linux-musl
          runner: ubuntu-24.04
          install: musl-tools
        - target: aarch64-unknown-linux-musl
          runner: ubuntu-latest
          install: musl-tools
        - target: x86_64-apple-darwin
          runner: macos-15-intel
    name: release-target (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    steps:
    - name: "\U0001F4C2 Checkout code"
      uses: actions/checkout@v6
    - name: Install musl-tools
      if: matrix.install == 'musl-tools'
      run: sudo apt-get update && sudo apt-get install -y musl-tools
    - uses: ./.github/actions/test-setup
    - name: Add target
      run: rustup target add ${{ matrix.target }}
    - name: "\U0001F9EA Tests"
      env:
        NEXTEST_NO_INPUT_HANDLER: 1
      run: cargo nextest run --target ${{ matrix.target }}
  benchmarks:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-24.04
    steps:
    - name: "\U0001F4C2 Checkout code"
      uses: actions/checkout@v6
    - name: "\U0001F4B0 Cache"
      uses: Swatinem/rust-cache@v2
    - name: Install shells (zsh, fish)
      uses: awalsh128/cache-apt-pkgs-action@v1.6.0
      with:
        packages: zsh fish
        version: 1.0
    - name: Install nushell
      uses: hustcer/setup-nu@v3
      with:
        version: 0.112.2
    - name: "\U0001F4B0 Rust repo cache"
      uses: actions/cache@v5
      with:
        path: target/bench-repos
        key: bench-repos-rust-${{ runner.os }}
    - name: "\U0001F4CA Run benchmarks"
      run: cargo bench
    - name: "\U0001F4E6 Upload benchmark results"
      uses: actions/upload-artifact@v7
      with:
        name: benchmark-results-${{ github.run_id }}
        path: target/criterion
    - name: "\U0001F4BE Append results to gist"
      if: github.repository_owner == 'max-sixty' && github.event_name == 'schedule'
      env:
        GITHUB_TOKEN: ${{ secrets.WORKTRUNK_BOT_TOKEN }}
        GIST_ID: 19bb23cb9658722abfe69479d0a4f9bf
      run: "set -euo pipefail\npython3 .github/scripts/criterion-to-jsonl.py --sha\
        \ \"$GITHUB_SHA\" > new-rows.jsonl\ngit clone \"https://x-access-token:${GITHUB_TOKEN}@gist.github.com/${GIST_ID}.git\"\
        \ /tmp/gist\ncat new-rows.jsonl >> /tmp/gist/results.jsonl\ngit -C /tmp/gist\
        \ \\\n  -c user.name=worktrunk-bot \\\n  -c user.email=worktrunk-bot@users.noreply.github.com\
        \ \\\n  commit -am \"benchmarks: ${GITHUB_SHA::7}\"\ngit -C /tmp/gist push\n"
  check-unused-dependencies:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-24.04
    steps:
    - name: "\U0001F4C2 Checkout code"
      uses: actions/checkout@v6
    - run: rustup override set nightly-2026-03-01
    - name: "\U0001F4B0 Cache"
      uses: Swatinem/rust-cache@v2
    - uses: baptiste0928/cargo-install@v3
      with:
        crate: cargo-udeps
        version: =0.1.60
    - uses: clechasseur/rs-cargo@v5.0.4
      with:
        command: udeps
        args: --all-targets
  minimal-versions:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-24.04
    steps:
    - name: "\U0001F4C2 Checkout code"
      uses: actions/checkout@v6
    - run: rustup override set nightly-2026-03-01
    - name: "\U0001F4B0 Cache"
      uses: Swatinem/rust-cache@v2
      with:
        key: minimal-versions
    - name: Resolve to minimum versions
      run: cargo update -Z minimal-versions
    - name: cargo check
      run: cargo check --workspace --all-targets
  nix-flake:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-24.04
    steps:
    - name: "\U0001F4C2 Checkout code"
      uses: actions/checkout@v6
    - name: Install Nix
      uses: cachix/install-nix-action@v31
      with:
        extra_nix_config: 'experimental-features = nix-command flakes

          access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

          '
    - name: nix flake check
      run: nix flake check --print-build-logs --keep-going
  create-issue-on-nightly-failure:
    needs:
    - feature-powerset
    - release-target
    - benchmarks
    - check-unused-dependencies
    - minimal-versions
    - nix-flake
    if: always() && contains(needs.*.result, 'failure') && github.repository_owner
      == 'wdrx70xn' && github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
    - name: "\U0001F4C2 Checkout code"
      uses: actions/checkout@v6
    - uses: JasonEtco/create-an-issue@v2
      env:
        GITHUB_TOKEN: ${{ secrets.WORKTRUNK_BOT_TOKEN }}
        LINK: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id
          }}
      with:
        filename: .github/nightly-failure.md
        update_existing: true
        search_existing: open
