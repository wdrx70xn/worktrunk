name: tend-notifications
'on':
  schedule:
  - cron: '*/15 * * * *'
  workflow_dispatch: null
jobs:
  notifications:
    if: github.repository_owner == 'wdrx70xn'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      id-token: write
      actions: read
      issues: write
    steps:
    - name: Check for unread notifications
      id: check
      run: "COUNT=$(gh api notifications --jq 'length')\nif [ \"$COUNT\" = \"0\" ];\
        \ then\n  echo \"count=0\" >> \"$GITHUB_OUTPUT\"\n  echo \"No unread notifications\
        \ \u2014 skipping\"\n  exit 0\nfi\n\n# --- Layer B: drop notifications shadowed\
        \ by recent dedicated runs ---\n# Event workflows mark their own notifications\
        \ read via action.yaml's\n# post-step on success; this sweeps the case where\
        \ Claude failed\n# (post-step is gated by `if: success()`) so the notification\
        \ still\n# gets cleared without burning Claude turns to rediscover it.\nSINCE=$(date\
        \ -u -d '30 minutes ago' +%Y-%m-%dT%H:%M:%SZ)\nRECENT_PRS=$(gh api \"repos/$GITHUB_REPOSITORY/actions/runs?created=>=$SINCE&per_page=50\"\
        \ --jq '[.workflow_runs[] | select(.name | test(\"^(tend-review|tend-mention|tend-triage|tend-ci-fix)$\"\
        )) | .pull_requests[]?.number] | unique | .[]' || true)\n\nif [ -n \"$RECENT_PRS\"\
        \ ]; then\n  NOTIFS=$(gh api notifications)\n  for pr in $RECENT_PRS; do\n\
        \    echo \"$NOTIFS\" | jq -r --arg repo \"$GITHUB_REPOSITORY\" --arg pr \"\
        $pr\" '.[] | select(.subject.url == \"https://api.github.com/repos/\" + $repo\
        \ + \"/pulls/\" + $pr or .subject.url == \"https://api.github.com/repos/\"\
        \ + $repo + \"/issues/\" + $pr) | .id' | while read -r tid; do\n      [ -n\
        \ \"$tid\" ] || continue\n      gh api \"notifications/threads/$tid\" -X PATCH\
        \ || true\n    done\n  done\nfi\n\n# --- Layer C: drop notifications on bot-authored\
        \ closed PRs ---\n# The bot auto-subscribes to its own PRs. After merge/close,\
        \ leftover\n# subscription notifications are pure noise \u2014 no action needed.\n\
        NOTIFS=$(gh api notifications)\necho \"$NOTIFS\" | jq -r --arg repo \"$GITHUB_REPOSITORY\"\
        \ '.[] | select(.repository.full_name == $repo and .subject.type == \"PullRequest\"\
        ) | .id' | while read -r tid; do\n  [ -n \"$tid\" ] || continue\n  PR_NUM=$(echo\
        \ \"$NOTIFS\" | jq -r --arg tid \"$tid\" '.[] | select(.id == $tid) | .subject.url\
        \ | split(\"/\") | last')\n  PR_INFO=$(gh api \"repos/$GITHUB_REPOSITORY/pulls/$PR_NUM\"\
        \ --jq '\"\\(.user.login) \\(.state)\"' 2>/dev/null) || continue\n  PR_AUTHOR=${PR_INFO%%\
        \ *}\n  PR_STATE=${PR_INFO##* }\n  if [ \"$PR_AUTHOR\" = \"worktrunk-bot\"\
        \ ] && [ \"$PR_STATE\" = \"closed\" ]; then\n    gh api \"notifications/threads/$tid\"\
        \ -X PATCH || true\n  fi\ndone\n\n# --- Layer D: count processable notifications\
        \ ---\n# Same-repo notifications younger than 10 minutes are deferred: a\n\
        # dedicated workflow (tend-review/mention/triage/ci-fix) is likely\n# still\
        \ starting up or mid-flight and hasn't posted its response yet.\n# Processing\
        \ them now risks duplicating work. Cross-repo notifications\n# are exempt\
        \ \u2014 no dedicated workflow handles them.\nCUTOFF=$(date -u -d '10 minutes\
        \ ago' +%Y-%m-%dT%H:%M:%SZ)\nREMAINING=$(gh api notifications)\nCOUNT=$(echo\
        \ \"$REMAINING\" | jq --arg repo \"$GITHUB_REPOSITORY\" --arg cutoff \"$CUTOFF\"\
        \ '[.[] | select(.repository.full_name != $repo or .updated_at <= $cutoff)]\
        \ | length')\necho \"count=$COUNT\" >> \"$GITHUB_OUTPUT\"\nif [ \"$COUNT\"\
        \ = \"0\" ]; then\n  TOTAL=$(echo \"$REMAINING\" | jq 'length')\n  if [ \"\
        $TOTAL\" = \"0\" ]; then\n    echo \"All notifications handled by pre-checks\
        \ \u2014 skipping\"\n  else\n    echo \"$TOTAL notification(s) remain but\
        \ all are fresh same-repo (deferred) \u2014 skipping\"\n  fi\nelse\n  echo\
        \ \"$COUNT processable notification(s) \u2014 proceeding\"\nfi\n"
      env:
        GITHUB_TOKEN: ${{ secrets.WORKTRUNK_BOT_TOKEN }}
    - uses: actions/checkout@v6
      if: steps.check.outputs.count != '0' || github.event_name == 'workflow_dispatch'
      with:
        ref: main
        fetch-depth: 0
        fetch-tags: true
        token: ${{ secrets.WORKTRUNK_BOT_TOKEN }}
    - uses: ./.github/actions/claude-setup
      if: steps.check.outputs.count != '0' || github.event_name == 'workflow_dispatch'
    - uses: max-sixty/tend@v1
      if: steps.check.outputs.count != '0' || github.event_name == 'workflow_dispatch'
      with:
        github_token: ${{ secrets.WORKTRUNK_BOT_TOKEN }}
        claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        bot_name: worktrunk-bot
        model: opus
        prompt: '/tend-ci-runner:notifications

          '
